# Teleconsultation consent text shown on the intake page (stored verbatim with each consent).
consent_version: "tpg-2020-v1"
consent_text: >-
  I consent to a teleconsultation with a registered medical practitioner of Metafix Clinic
  over video or audio. I understand that a teleconsultation has limits compared with an
  in-person examination, that the doctor may ask me to visit in person or get tests done,
  and that my information will be used only for my care and kept confidential as required
  by the Telemedicine Practice Guidelines 2020 and the Digital Personal Data Protection Act 2023.

intake_purpose: >-
  We collect this information only to prepare for and conduct your consultation, write your
  prescription and keep your medical record. It is shared with no one outside the clinic
  except the services we use to send you messages and store your files.
