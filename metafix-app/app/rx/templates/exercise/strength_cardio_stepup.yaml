id: strength_cardio_stepup
version: "1.0"
title: "EXERCISE PLAN"
intro: "Aim for 150 minutes of brisk activity plus 2–3 strength sessions a week, built up gradually."
weekly:
  - { day: "Mon", activity: "Brisk walk + strength circuit A (squats to chair, wall push-ups, band rows, glute bridge)", duration: "30 + 20 min" }
  - { day: "Tue", activity: "Brisk walk or cycling", duration: "30–40 min" }
  - { day: "Wed", activity: "Strength circuit B (step-ups, band chest press, dead-bug, calf raises)", duration: "25 min" }
  - { day: "Thu", activity: "Brisk walk with 1-minute faster intervals", duration: "30–40 min" }
  - { day: "Fri", activity: "Strength circuit A", duration: "25 min" }
  - { day: "Sat", activity: "Long walk, swim or sport", duration: "45–60 min" }
  - { day: "Sun", activity: "Rest or gentle stretching", duration: "15 min" }
progression:
  title: "PROGRESSION"
  columns: ["Weeks 1–2", "Weeks 3–6", "Weeks 7–12"]
  rows:
    - { label: "Walking", values: ["20 min/day, easy pace", "30 min, brisk", "40 min, brisk with intervals"] }
    - { label: "Strength", values: ["1 set × 10, 2 days", "2 sets × 12, 3 days", "3 sets × 12, add weight/band"] }
    - { label: "Steps/day", values: ["5,000", "7,500", "10,000"] }
precautions:
  - "Warm up for 5 minutes and cool down for 5 minutes each session."
  - "Stop if you feel chest pain, unusual breathlessness or dizziness."
  - "Carry a sugar source if you are on sugar-lowering tablets or insulin."
protein_timing: "Have a protein-rich food (curd, paneer, eggs, dal, whey) within 1 hour after strength sessions."
