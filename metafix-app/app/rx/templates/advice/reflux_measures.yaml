id: reflux_measures
version: "1.0"
title: "ACIDITY AND REFLUX — MEASURES"
bullets:
  - "Eat the last meal at least 3 hours before lying down."
  - "Raise the head end of the bed by 6 inches (blocks under the legs, not extra pillows)."
  - "Smaller meals; limit fried, very spicy and tomato-heavy food, tea and coffee."
  - "Avoid tight clothing around the waist."
