id: sglt2_precautions
version: "1.0"
title: "WITH YOUR SUGAR-PASSING TABLET (SGLT2)"
bullets:
  - "Drink enough water through the day — about 2.5–3 litres unless you have been told to restrict fluids."
  - "Keep the genital area clean and dry; wash after passing urine. Report itching, discharge or burning."
  - "You will pass more urine — this is expected."
  - "Stop the tablet on days you cannot eat or drink, and before any surgery (see the sick-day rules)."
