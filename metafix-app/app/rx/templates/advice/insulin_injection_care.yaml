id: insulin_injection_care
version: "1.0"
title: "INSULIN — INJECTION CARE"
bullets:
  - "Inject at the same time each day, into the tummy (two fingers away from the navel) or thigh."
  - "Rotate sites; do not inject into lumps or bruises."
  - "Use a new needle each time; prime the pen with 2 units before each dose."
  - "Keep spare pens in the fridge; never freeze insulin."
  - "Always carry a sugar source in case of a low."
