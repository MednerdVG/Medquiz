id: contraception_on_glp1
version: "1.0"
title: "PREGNANCY AND CONTRACEPTION"
style: warn
bullets:
  - "Do not become pregnant while on this injection. Use reliable contraception throughout."
  - "Tirzepatide can reduce the effect of oral contraceptive pills — use a barrier method as well for 4 weeks after starting and after each dose increase, or use a non-oral method."
  - "If you plan a pregnancy, tell the clinic: the injection is usually stopped at least 2 months before trying."
  - "If you become pregnant, stop the injection and contact the clinic."
