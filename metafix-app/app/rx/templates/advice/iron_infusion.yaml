id: iron_infusion
version: "1.0"
title: "IRON INFUSION — AFTER CARE"
bullets:
  - "Mild headache, body ache or a metallic taste for a day or two is common."
  - "Tell the clinic at once about rash, breathlessness, swelling of the face or chest tightness."
  - "Do not take iron tablets for 4 weeks after the infusion unless advised."
  - "Repeat blood tests only after the interval advised — earlier values can mislead."
