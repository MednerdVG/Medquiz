id: foot_care
version: "1.0"
title: "FOOT CARE"
bullets:
  - "Look at both feet every day, including between the toes and the soles — use a mirror if needed."
  - "Wash in lukewarm water and dry well between the toes; moisturise the heels but not between the toes."
  - "Never walk barefoot, even at home. Wear soft, well-fitting footwear."
  - "Cut nails straight across; do not cut corns yourself."
  - "Show any cut, blister, colour change or wound to the clinic the same week."
