id: glp1_weekly
version: "1.0"
title: "YOUR WEEKLY INJECTION"
supply_contact: glp1
bullets:
  - "Take it on the same day each week, at any time of day, with or without food."
  - "Inject under the skin of the tummy, thigh or upper arm; change the site each week."
  - "Nausea, fullness and loose motions are common in the first weeks and after each dose step-up — eat smaller meals and stop when full."
  - "Missed dose: take it if the next dose is more than 4 days away; otherwise skip it and continue on the usual day."
  - "Store unused pens in the fridge (not the freezer). The pen in use can stay at room temperature as per the pack."
  - "Stop and contact the clinic if you have severe or persistent stomach pain, repeated vomiting or yellowing of the eyes."
