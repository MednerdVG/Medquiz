id: thyroxine_timing
version: "1.0"
title: "THYROID TABLET — TIMING"
bullets:
  - "Take it on waking with a glass of plain water, on an empty stomach."
  - "Wait 30–45 minutes before tea, coffee, milk or breakfast."
  - "Keep calcium, iron and antacid tablets at least 4 hours apart."
  - "On the day of a thyroid blood test, take the tablet after the blood is drawn."
