  Rozavel:         { molecules: [rosuvastatin], strengths: ["5", "10", "20", "40"] }
  Atorva:          { molecules: [atorvastatin], strengths: ["10", "20", "40", "80"] }
  Sybrava:         { molecules: [inclisiran], strengths: ["284"], schedule: six_monthly }
  Ezedoc:          { molecules: [ezetimibe], strengths: ["10"] }
  # blood pressure
