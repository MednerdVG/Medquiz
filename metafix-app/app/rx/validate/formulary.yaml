  Gemer:           { molecules: [glimepiride, metformin], strengths: ["1", "2", "3", "4"] }
  Amaryl:          { molecules: [glimepiride], strengths: ["1", "2", "3", "4"] }
  Januvia:         { molecules: [sitagliptin], strengths: ["25", "50", "100"] }
