# Single compose file: app + worker (reminders, RQ jobs) + Postgres + Redis.
# Caddy in front gets a free HTTPS certificate for DOMAIN automatically.
# Keep the VM / bucket in an Indian region (DPDP).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: metafix, POSTGRES_USER: metafix, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set it}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://metafix:${POSTGRES_PASSWORD}@db/metafix
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes: [files:/data]
    expose: ["8000"]
    depends_on: [db, redis]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://metafix:${POSTGRES_PASSWORD}@db/metafix
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes: [files:/data]
    command: ["sh", "-c", "rq worker metafix --url redis://redis:6379/0 & python -m app.jobs.reminders"]
    depends_on: [db, redis]
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env, e.g. app.metafix.clinic}" }
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [app]
    restart: unless-stopped
volumes: { pgdata: {}, files: {}, caddy_data: {} }
